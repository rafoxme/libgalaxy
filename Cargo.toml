[workspace]
resolver = "2"
members = [
    "libgalaxy",
    "libgalaxy-config",
    "libgalaxy-config-derive",
    "libgalaxy-theme",
    "examples/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libgalaxy/libgalaxy"
description = "A GPUI-based Rust GUI library implementing libadwaita widgets with the Ubuntu Yaru theme."

[workspace.dependencies]
# GPUI (Zed's UI framework), pinned to the v1.15.0 tag of the zed monorepo.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e17dc4f9d50db73a458b64dcce50ecd4878b98a3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e17dc4f9d50db73a458b64dcce50ecd4878b98a3", features = ["wayland", "x11"] }

serde = { version = "1", features = ["derive"] }
ron = "0.8"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
